name: Validar integração
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:http
      - name: Validate Baileys worker
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize local Supabase configuration
        run: |
          supabase init
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path("supabase/config.toml")
          content = config.read_text()
          section = re.search(r"(?ms)^\\[db\\.migrations\\]\\s*$.*?(?=^\\[|\\Z)", content)
          if section:
              block = section.group(0)
              if re.search(r"(?m)^enabled\\s*=", block):
                  block = re.sub(r"(?m)^enabled\\s*=.*$", "enabled = false", block)
              else:
                  block += "\\nenabled = false\\n"
              content = content[:section.start()] + block + content[section.end():]
          else:
              content += "\\n[db.migrations]\\nenabled = false\\n"
          config.write_text(content)
          PY
      - name: Start local Supabase without applying migrations
        run: supabase start -x studio,mailpit,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Prepare empty database with original schema
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/fixtures/base_schema.sql
      - name: Apply migrations
        run: supabase migration up --local
      - name: Run PostgreSQL integration tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/database.sql
